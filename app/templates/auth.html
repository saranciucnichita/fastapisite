<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход/Регистрация</title>
    <style>
        body {
            font-family: Arial,
            sans-serif; 
            margin: 0; 
            padding: 20px;
            background-color: #f4f7f6;
        }
        .container {
	max-width: 400px;
	margin: 50px auto;
	padding: 20px;
	background-color: white;
	border-radius: 8px;
	box-shadow: 0 4px 8px rgba(0,0,0,0.1);
	}

        h2 {
	text-align: center;
	color: #333;
	}

        form div { margin-bottom: 15px; }
        label { display: block;
	margin-bottom: 5px;
	font-weight: bold;
	}

        input[type="text"], input[type="password"] {
	width: 100%; padding: 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	box-sizing: border-box;
	}

        button {
	width: 100%;
	padding: 10px;
	background-color: #007bff;
	color: white;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	font-size: 16px;
	margin-top: 10px;
	}

        button:hover { background-color: #0056b3; }

        .error {
	color: red;
	text-align: center;
	margin-bottom: 15px;
	}
    </style>
</head>
<body>
    <div class="container">
        <h2>Вход/Регистрация</h2>
        
        {% if error %}
            <p class="error">Ошибка: {{ error }}</p>
        {% endif %}

        <form method="POST" action="/auth">
            <div>
                <label for="login">Логин:</label>
                <input type="text" id="login" name="login" required>
            </div>
            <div>
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div id="name_field">
                <label for="name">Имя пользователя (для регистрации):</label>
                <input type="text" id="name" name="name" autocomplete="off">
            </div>
            
            <button type="submit" name="action" value="login" style="background-color: #28a745;">Войти</button>
            <button type="submit" name="action" value="register">Зарегистрироваться</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #007bff;">&#8592; Назад</a>
        </p>
    </div>
</body>
</html>
