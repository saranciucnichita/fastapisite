<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <style>
        body {
	font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6;
	}

        .container {
	max-width: 600px;
	margin: 50px auto;
	padding: 30px;
	background-color: white;
	border-radius: 8px;
	box-shadow: 0 4px 8px rgba(0,0,0,0.1);
	}

        h2 {
	text-align: center;
	color: #333;
	margin-bottom: 30px;
	}

        .profile-photo {
	text-align: center;
	margin-bottom: 20px;
	}

        .profile-photo img {
	width: 150px;
	height: 150px;
	object-fit: cover;
	border-radius: 50%;
	border: 4px solid #007bff;
	}

        form div { margin-bottom: 15px; }

        label {
	display: block;
	margin-bottom: 5px;
	font-weight: bold;
	}

        input[type="text"], textarea {
	width: 100%;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	box-sizing: border-box;
	resize: vertical;
	}

        input[type="file"] { padding: 5px 0; }

        button {
	padding: 10px 15px;
	background-color: #28a745;
	color: white;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	font-size: 16px;
	margin-top: 10px;
	}

        .logout-link {
	display: block;
	text-align: center;
	margin-top: 20px;
	color: #dc3545;
	text-decoration: none;
	}

        .message-box {
	background-color: #d4edda;
	color: #155724;
	border: 1px solid #c3e6cb;
	padding: 10px;
	border-radius: 4px;
	text-align: center;
	margin-bottom: 15px;
	}

        .error-box {
	background-color: #f8d7da;
	color: #721c24;
	border: 1px solid #f5c6cb;
	padding: 10px;
	border-radius: 4px;
	text-align: center;
	margin-bottom: 15px;
	}
    </style>
</head>
<body>
    <div class="container">
        <h2>Добро пожаловать, {{ user.name }}!</h2>

        {% if message %}
            <p class="message-box">{{ message }}</p>
        {% endif %}
        {% if error %}
            <p class="error-box">Ошибка: {{ error }}</p>
        {% endif %}

        <div class="profile-photo">
            <img src="{{ url_for('images', path=user.photo) }}" alt="Ваше фото">
        </div>
        
        <form method="POST" action="/profile" enctype="multipart/form-data">
            <div>
                <label for="message">Текстовое сообщение:</label>
                <textarea id="message" name="message" rows="4">{{ user.message }}</textarea>
            </div>
            
            <div>
                <label for="photo">Загрузить новое фото (PNG/JPG/JPEG):</label>
                <input type="file" id="photo" name="photo" accept="image/png, image/jpeg">
            </div>
            
            <button type="submit">Обновить профиль</button>
        </form>

        <a href="/logout" class="logout-link">Выйти из аккаунта</a>
        <a href="/" style="display: block; text-align: center; margin-top: 10px;">&#8592; На главную</a>

	<hr style="margin-top: 30px; border: 0; border-top: 1px solid #eee;">
	<div style="text-align: center; margin-top: 20px;">

    	<form method="POST" action="/profile/delete" onsubmit="return confirm('Вы уверены, что хотите удалить профиль? Это действие необратимо.');">
        <button type="submit" style="background-color: #dc3545; font-size: 14px;">
            Удалить мой профиль навсегда
        </button>
        </form>
	</div>

    </div>
</body>
</html>
